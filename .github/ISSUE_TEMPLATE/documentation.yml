name: Documentation
description: Request an improvement to the existing documentation
title: '[DOC] '
labels: ['documentation', 'triage']
type: Enhancement

body:

- type: markdown
  attributes:
    value: |
      '#### Describe what improvement you would like to see in the documentation.'

- type: checkboxes
  attributes:
    label: Is there an existing issue for this?
    description: |
      Please search through [the past issues](https://github.com/aramis-lab/clinicadl/issues) to see if an issue already exists for the documentation enhancement you want.
    options:
      - label: I have searched the existing issues
        required: true

- type: textarea
  attributes:
    label: Describe the issue linked to the documentation
    description: |
      Tell us about the confusion introduced in the documentation.
  validations:
    required: true

- type: textarea
  attributes:
    label: Suggest a potential alternative/fix
    description: |
      Tell us how we could improve the documentation in this regard.
  validations:
    required: false
