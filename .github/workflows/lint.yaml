name: 'Lint codebase'

on:
  pull_request:
    branches: [ "dev", "master"]
  push:
    branches: [ "dev", "master"]

permissions:
  contents: read

jobs:
  lint:
    if: >
      !contains(github.event.head_commit.message, '[only doc]') &&
      !contains(github.event.head_commit.message, '[only tests]') &&
      !contains(github.event.head_commit.message, '[only gpu]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: pre-commit/actions@v3.0.1
