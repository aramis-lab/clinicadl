name: 'Lint codebase'

on:
  pull_request:
    branches: [ "dev", "master"]
  push:
    branches: [ "dev", "master"]

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ #
  #  Read the HEAD commit message (works for both push and PR events)  #
  # ------------------------------------------------------------------ #
  check-commit:
    name: Check commit message
    runs-on: ubuntu-latest
    outputs:
      head-commit-message: ${{ steps.get_head_commit_message.outputs.headCommitMsg }}
    steps:
      - name: Get repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Print head git commit message
        id: get_head_commit_message
        run: echo "headCommitMsg=$(git show -s --format=%s)" >> $GITHUB_OUTPUT

  lint:
    needs: check-commit
    if: >
      !contains(needs.check-commit.outputs.head-commit-message, '[only doc]') &&
      !contains(needs.check-commit.outputs.head-commit-message, '[only tests]') &&
      !contains(needs.check-commit.outputs.head-commit-message, '[only gpu]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: pre-commit/actions@v3.0.1
