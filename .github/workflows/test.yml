name: Test

on:
  push:
    branches: ["dev", "master"]
  pull_request:
    branches: ["dev", "master"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "1.8.3"
  PREFERRED_PYTHON_VERSION: "3.12"

jobs:
  # ------------------------------------------------------------------ #
  #  Read the HEAD commit message (works for both push and PR events)  #
  # ------------------------------------------------------------------ #
  check-commit:
    name: Check commit message
    runs-on: ubuntu-latest
    outputs:
      head-commit-message: ${{ steps.get_head_commit_message.outputs.headCommitMsg }}
    steps:
      - name: Get repo
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Print head git commit message
        id: get_head_commit_message
        run: echo "::set-output name=headCommitMsg::$(git show -s --format=%s)"

  cpu-unit-tests:
    name: Unit tests on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    needs: check-commit
    if: >
      github.event.action != 'ready_for_review' &&
      !contains(needs.check-commit.outputs.head-commit-message, '[only doc]') &&
      !contains(needs.check-commit.outputs.head-commit-message, '[skip tests]') &&
      !contains(needs.check-commit.outputs.head-commit-message, '[only gpu]')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
      - name: Run unit tests
        run: make unit-tests
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: unittests-${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false

  gpu-unit-tests:
    name: GPU unit tests
    needs: check-commit
    if: >
      github.event.action != 'ready_for_review' &&
      !contains(needs.check-commit.outputs.head-commit-message, '[only doc]') &&
      !contains(needs.check-commit.outputs.head-commit-message, '[skip tests]') &&
      !contains(needs.check-commit.outputs.head-commit-message, '[skip gpu]')
    runs-on:
      - self-hosted
      - gpu
    steps:
      - uses: actions/checkout@v6
      - uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PREFERRED_PYTHON_VERSION }}
          cache: poetry
      - name: Run unit tests
        run: make gpu-unit-tests
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: gpu-unittests
          name: gpu-unittests
          fail_ci_if_error: false

  cpu-functional-test:
    name: Functional tests
    needs: check-commit
    if: >
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false
        )
      ) &&
      !contains(needs.check-commit.outputs.head-commit-message, '[only doc]') &&
      !contains(needs.check-commit.outputs.head-commit-message, '[skip tests]') &&
      !contains(needs.check-commit.outputs.head-commit-message, '[skip functional-tests]') &&
      !contains(needs.check-commit.outputs.head-commit-message, '[only gpu]')
    runs-on:
      - self-hosted
      - functional-tests
    steps:
      - uses: actions/checkout@v6
      - uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PREFERRED_PYTHON_VERSION }}
          cache: poetry
      - name: Run functional tests
        run: make functional-tests
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: functional
          name: functional
          fail_ci_if_error: false

  gpu-functional-test:
    name: GPU functional tests
    needs: check-commit
    if: >
      (
        github.event_name == 'push' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false
        )
      ) &&
      !contains(needs.check-commit.outputs.head-commit-message, '[only doc]') &&
      !contains(needs.check-commit.outputs.head-commit-message, '[skip tests]') &&
      !contains(needs.check-commit.outputs.head-commit-message, '[skip functional-tests]') &&
      !contains(needs.check-commit.outputs.head-commit-message, '[skip gpu]')
    runs-on:
      - self-hosted
      - functional-tests
    steps:
      - uses: actions/checkout@v6
      - uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PREFERRED_PYTHON_VERSION }}
          cache: poetry
      - name: Run functional tests
        run: make gpu-functional-tests
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: gpu-functional
          name: gpu-functional
          fail_ci_if_error: false

  multi-gpu-unit-tests:
    name: Multi-GPUs unit tests
    needs: check-commit
    if: >
      github.event.action != 'ready_for_review' &&
      !contains(needs.check-commit.outputs.head-commit-message, '[only doc]') &&
      !contains(needs.check-commit.outputs.head-commit-message, '[skip tests]') &&
      !contains(needs.check-commit.outputs.head-commit-message, '[skip gpu]')
    runs-on:
      - self-hosted
      - multi-gpu
    steps:
      - uses: actions/checkout@v6
      - uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PREFERRED_PYTHON_VERSION }}
          cache: poetry
      - name: Cache issue (to solve)
        run: rm -rf ~/.cache/pypoetry ~/.cache/pip
      - name: Run unit tests
        run: make multi-gpu-unit-tests
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: multi-gpu-unittests
          name: multi-gpu-unittests
          fail_ci_if_error: false
