name: PR Agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr_agent_job:
    if: >-
      github.event.issue.pull_request &&
      (
        startsWith(github.event.comment.body, '/review') ||
        startsWith(github.event.comment.body, '/improve') ||
        startsWith(github.event.comment.body, '/describe')
      ) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: self-hosted
    steps:
      - name: Check PR-Agent installation
        run: |
          VENV="$RUNNER_TEMP/../../venv/pr-agent"

          if [ ! -x "$VENV/bin/python" ] ||
             ! "$VENV/bin/python" -m pip show pr-agent >/dev/null 2>&1; then
            echo "PR-Agent is not installed in $VENV" >&2
            exit 1
          fi

          # to make the variable available to subsequent steps
          echo "VENV=$VENV" >> "$GITHUB_ENV"

      - name: Run PR-Agent command
        env:
          PR_URL: ${{ github.event.issue.pull_request.html_url }}
          COMMAND: ${{ github.event.comment.body }}
          GITHUB__USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI__KEY: ${{ secrets.LLM_KEY }}
          OPENAI__API_BASE: ${{ secrets.LLM_API }}
          SSL_VERIFY: "false"
        run: |
          "$VENV/bin/python" - <<'PY'
          import os
          import shlex
          import subprocess
          import sys

          tokens = shlex.split(os.environ["COMMAND"])

          allowed = {"review", "improve", "describe"}
          if not tokens or tokens[0] not in {
              "/" + cmd for cmd in allowed
          }:
              sys.exit("Unsupported PR-Agent command")

          command = tokens[0][1:]

          subprocess.run([
              sys.executable, "-m", "pr_agent.cli",
              "--pr_url", os.environ["PR_URL"],
              command,
              *tokens[1:],
          ], check=True)
          PY
