
[project]
name = "clinicadl"
version = "1.6.1"
description = "Framework for the reproducible processing of neuroimaging data with deep learning methods"
license = "MIT"
authors = [{name = "Aramis Lab"}]
maintainers = [{name = "Clinica developers", email="clinica-user@inria.fr"}]
readme = "README.md"
requires-python = ">=3.9,<=3.12"
keywords = [
    "bids",
    "image processing",
    "deep learning",
    "neuroimaging",
    "neuroscience"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing"
]
dependencies = [
"torch>=2.3.0,<3.0.0",
"torchvision",
"tensorboard",
"toml",
"pandas>=2,<3",
"numpy>=2,<3",
"scikit-learn>=1,<2",
"scikit-image>=0.24,<0.25",
"joblib>=1.2.0,<2",
"click>=8,<9",
"click-option-group>=0.5, <0.6",
"pynvml",
"torchio>=0.18.90,<0.19",
"urllib3<3.0.0",
"nilearn>=0.9.2,<0.12",
"pydantic>=2.7.0,<2.11",
"monai[einops,huggingface_hub]>=1.3.1,<1.5",
]

[project.urls]
homepage = "https://clinicadl.readthedocs.io"
repository = "https://github.com/aramis-lab/clinicadl.git"
documentation =  "https://clinicadl.readthedocs.io"

[tool.poetry]
requires-poetry = ">=2.0"

[project.scripts]
clinicadl = "clinicadl.cmdline:cli"

[tool.poetry.group.tracking]
optional = true
[tool.poetry.group.tracking.dependencies]
wandb = "^0.15.4"
mlflow = "^2.0.0"
codecarbon = "^2.3.1"

[tool.poetry.group.dev.dependencies]
pre-commit = "*"
pytest = "*"
pytest-timeout = "*"
pytest-xdist = "*"
pytest-cov = ">=2.0.0,<4.0.0"

[tool.poetry.group.docs]
optional = true
[tool.poetry.group.docs.dependencies]
pymdown-extensions = "^10.13"
mkdocs = "^1.6.1"
mkdocs-material = "^9.5.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py38"
line-length = 88
[tool.ruff.lint]
select = [
    "E",
    "W",
    "I",
]
ignore = ["E203", "E501"]
[tool.ruff.lint.isort]
known-first-party = ["clinicadl"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.codespell]
summary = ''
skip = ".git,LICENSE.txt,*.m,clinicadl/resources/config/train_config.toml"
quiet-level = 3
ignore-words-list = "nd,fwe,commun,fo,te,artic,ressources,adn"
