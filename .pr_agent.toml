[config]
model = "litellm_proxy/anthropic/claude-sonnet-4-5"
fallback_models = []

[pr_reviewer]
persistent_comment = false
publish_review_failure_comment = true
enable_review_coverage_footer = true
enable_large_pr_chunking = true
inline_key_issues = false
extra_instructions = ""
num_max_findings = 10

require_estimate_effort_to_review = true
require_tests_review = true
require_security_review = true

enable_review_labels_security = true
enable_review_labels_effort = true

[pr_description]
publish_description_as_comment = true
publish_description_as_comment_persistent = true
add_original_user_description = false
extra_instructions = ""
enable_pr_description = true

[pr_code_suggestions]
extra_instructions = ""
committable_code_suggestions = false
dual_publishing_score_threshold = -1
suggestions_score_threshold = 0
focus_only_on_problems = false
enable_suggestions_coverage_footer = true
persistent_comment = false
num_code_suggestions_per_chunk = 10
max_suggestions_per_file = 0
